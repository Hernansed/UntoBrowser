name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish never

      - name: Build Linux packages (deb + rpm)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux deb rpm --publish never

      - name: Stable download names (latest)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp dist/unto-browser_*_amd64.deb dist/unto-browser-latest.deb
          cp dist/unto-browser-*.x86_64.rpm dist/unto-browser-latest.rpm

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
