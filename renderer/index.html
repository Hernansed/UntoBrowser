<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' unto:; style-src 'self' 'unsafe-inline' unto:; script-src 'self' unto:; frame-src unto:; img-src * data:; connect-src *">
  <title>Unto Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <button id="btn-back" title="Back (Alt+Left)">&#8592;</button>
    <button id="btn-fwd" title="Forward (Alt+Right)">&#8594;</button>
    <button id="btn-reload" title="Reload (Ctrl+R)">&#8635;</button>
    <button id="btn-home" title="Home">&#8962;</button>

    <input id="urlbar" type="text" spellcheck="false"
           placeholder="Search or enter address" autocomplete="off">

    <button id="btn-bookmark" title="Bookmark this page">&#9734;</button>
    <button id="btn-downloads" title="Downloads">&#8681;</button>
    <button id="btn-menu" title="Menu">&#9776;</button>
  </header>

  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="btn-newtab" title="New tab (Ctrl+T)">+</button>
  </div>

  <main id="content"></main>

  <div id="dlpanel" class="hidden">
    <div class="dlhead">
      <span>Downloads</span>
      <button id="dl-clear" title="Clear list">Clear</button>
    </div>
    <div id="dl-list"></div>
    <div id="dl-empty" class="dl-empty">No downloads yet</div>
  </div>

  <div id="menu" class="hidden">
    <button data-action="new-tab">New tab</button>
    <button data-action="private-tab">New private tab</button>
    <button data-action="history">History</button>
    <button data-action="bookmarks">Bookmarks</button>
    <button data-action="downloads">Downloads</button>
    <button data-action="settings">Settings</button>
    <button data-action="zoom-in">Zoom in</button>
    <button data-action="zoom-out">Zoom out</button>
    <button data-action="zoom-reset">Reset zoom</button>
    <button data-action="devtools">Developer tools</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
