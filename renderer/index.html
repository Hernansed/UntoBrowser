<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' unto:; style-src 'self' 'unsafe-inline' unto:; script-src 'self' unto:; frame-src unto:; img-src * data:; connect-src *">
  <title>Unto Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <button id="btn-back" title="Back (Alt+Left)"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="btn-fwd" title="Forward (Alt+Right)"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-7 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="btn-reload" title="Reload (Ctrl+R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="btn-home" title="Home (Alt+Home)"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5M6.5 10.5V20h11v-9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

    <div id="urlbarwrap">
      <svg id="padlock" viewBox="0 0 24 24" title="Connection is secure"><rect x="5.5" y="10.5" width="13" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <input id="urlbar" type="text" spellcheck="false"
             placeholder="Search or enter address" autocomplete="off">
      <button id="btn-bookmark" title="Bookmark this page (Ctrl+D)"><svg viewBox="0 0 24 24"><path id="bm-star" d="m12 3.8 2.5 5 5.6.8-4 4 .9 5.6-5-2.7-5 2.7.9-5.6-4-4 5.6-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
    </div>

    <button id="btn-downloads" title="Downloads (Ctrl+J)"><svg viewBox="0 0 24 24"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="btn-menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </header>

  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="btn-newtab" title="New tab (Ctrl+T)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>

  <main id="content"></main>

  <div id="menu" class="hidden">
    <button data-action="new-tab">New tab<span class="kbd">Ctrl+T</span></button>
    <button data-action="private-tab">New private tab<span class="kbd">Ctrl+Shift+N</span></button>
    <hr>
    <button data-action="downloads">Downloads<span class="kbd">Ctrl+J</span></button>
    <button data-action="history">History<span class="kbd">Ctrl+H</span></button>
    <button data-action="bookmarks">Bookmarks<span class="kbd">Ctrl+Shift+O</span></button>
    <hr>
    <button data-action="zoom-in">Zoom in<span class="kbd">Ctrl+</span></button>
    <button data-action="zoom-out">Zoom out<span class="kbd">Ctrl−</span></button>
    <button data-action="zoom-reset">Reset zoom<span class="kbd">Ctrl0</span></button>
    <hr>
    <button data-action="devtools">Developer tools<span class="kbd">F12</span></button>
    <button data-action="settings">Settings<span class="kbd">Ctrl+,</span></button>
  </div>

  <div id="dlpanel" class="hidden">
    <div class="dlhead">
      <span>Downloads</span>
      <button id="dl-clear" title="Clear list">Clear</button>
    </div>
    <div id="dl-list"></div>
    <div id="dl-empty" class="dl-empty">No downloads yet</div>
  </div>

  <script src="themes.js"></script>
  <script src="app.js"></script>
</body>
</html>
