<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — Unto Browser</title>
<style>
:root{
  --bg:#05070d; --bg2:#0a0f1c; --card:#0e1526; --card2:#131c33;
  --text:#eef2fb; --muted:#8ea0c4; --border:#1d2946;
  --accent:#2f6fed; --accent2:#5a8bff; --glow:rgba(47,111,237,.35);
}
*{box-sizing:border-box;margin:0}
body{
  min-height:100vh;font:14px/1.5 system-ui,sans-serif;color:var(--text);
  background:radial-gradient(900px 400px at 50% -10%, var(--bg2), var(--bg));
  padding:48px 20px 60px;user-select:none;
}
.wrap{width:min(680px,94vw);margin:0 auto}
h1{font-size:26px;letter-spacing:-.3px;margin-bottom:4px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-bottom:28px}
section{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;margin-bottom:16px;
}
section h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.row+.row{border-top:1px solid var(--border)}
.row label{font-size:14px}
.row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
select,input[type=text],input[type=password],input[type=url]{
  background:var(--card2);color:var(--text);border:1px solid var(--border);
  border-radius:9px;padding:9px 12px;font-size:13.5px;outline:none;min-width:230px;
}
select:focus,input:focus{border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
input[type=color]{width:44px;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--card2);padding:3px}
.btn{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:10px 18px;font-size:13.5px;cursor:pointer;transition:filter .15s;
}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:#8a1f33}
.saved{color:var(--accent2);font-size:12.5px;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.tchip{
  border:2px solid var(--border);background:var(--card2);color:var(--muted);
  border-radius:9px;padding:8px 14px;font-size:12.5px;cursor:pointer;transition:all .15s;
}
.tchip:hover{color:var(--text);transform:translateY(-1px)}
.tchip.on{border-color:var(--accent);color:var(--text);box-shadow:0 4px 12px var(--glow)}
.back{color:var(--muted);font-size:12.5px;text-decoration:none;display:inline-block;margin-bottom:22px}
.back:hover{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="unto://app/unto.html">← Back to start page</a>
  <h1>Un<span>to</span> Settings</h1>
  <div class="sub">Unto Browser 0.5.0 · Chromium engine · all data stays on your device</div>

  <section>
    <h2>Search</h2>
    <div class="row">
      <label>Default search engine</label>
      <select id="engine"></select>
    </div>
    <div class="row">
      <label>Live search suggestions<small>Google suggest API while typing</small></label>
      <input type="checkbox" id="sug" checked>
    </div>
  </section>

  <section>
    <h2>Appearance</h2>
    <div class="row" style="flex-direction:column;align-items:flex-start;gap:10px">
      <label>Start page theme</label>
      <div class="themes" id="themes"></div>
    </div>
    <div class="row">
      <label>Custom accent color</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="color" id="accent">
        <button class="btn ghost" id="accentReset">Reset</button>
      </div>
    </div>
    <div class="row">
      <label>Animations<small>disable on slow machines</small></label>
      <input type="checkbox" id="anim" checked>
    </div>
    <div class="row">
      <label>24-hour clock</label>
      <input type="checkbox" id="h24" checked>
    </div>
  </section>

  <section>
    <h2>Privacy</h2>
    <div class="row">
      <label>Clear browsing data<small>cache, cookies, localStorage of visited sites</small></label>
      <button class="btn danger" id="clearData">Clear now</button>
    </div>
    <div class="row">
      <label>Clear history</label>
      <button class="btn ghost" id="clearHist">Clear</button>
    </div>
  </section>

  <section>
    <h2>Unto AI</h2>
    <div class="row"><label>API endpoint<small>OpenAI, OpenRouter, Groq, Ollama (http://localhost:11434/v1)</small></label>
      <input type="url" id="aiUrl" placeholder="https://api.openai.com/v1"></div>
    <div class="row"><label>API key<small>stored locally, never sent anywhere else</small></label>
      <input type="password" id="aiKey" placeholder="sk-..."></div>
    <div class="row"><label>Model</label>
      <input type="text" id="aiModel" placeholder="gpt-4o-mini"></div>
  </section>

  <div style="display:flex;align-items:center;gap:14px">
    <button class="btn" id="save">Save settings</button>
    <span class="saved" id="savedMsg">Saved ✓</span>
  </div>
</div>

<script>
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('unto.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ localStorage.setItem('unto.'+k, JSON.stringify(v)); }
};
const $ = s => document.querySelector(s);

const ENGINES = {
  google:'Google', ddg:'DuckDuckGo', perplexity:'Perplexity', bing:'Bing', brave:'Brave',
  ecosia:'Ecosia', startpage:'Startpage', mojeek:'Mojeek', youtube:'YouTube',
  github:'GitHub', wikipedia:'Wikipedia', reddit:'Reddit', amazon:'Amazon', maps:'Maps', images:'Images',
};
const THEMES = ['noir','ocean','snow','graphite','midnight'];

// populate engines
$('#engine').innerHTML = Object.entries(ENGINES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#engine').value = LS.get('engine','google');

// themes
const cur = LS.get('theme','noir');
$('#themes').innerHTML = THEMES.map(t=>`<button class="tchip ${t===cur?'on':''}" data-t="${t}">${t}</button>`).join('');
$('#themes').querySelectorAll('.tchip').forEach(b=>b.onclick=()=>{
  LS.set('theme',b.dataset.t);
  $('#themes').querySelectorAll('.tchip').forEach(x=>x.classList.toggle('on',x===b));
});

// load current values
const ai = LS.get('ai',{});
$('#aiUrl').value = ai.url||''; $('#aiKey').value = ai.key||''; $('#aiModel').value = ai.model||'';
$('#anim').checked = LS.get('anim','1')==='1';
$('#h24').checked = LS.get('h24', true);
$('#sug').checked = LS.get('suggestions', true);
if(LS.get('accent',null)) $('#accent').value = LS.get('accent',null);

$('#accentReset').onclick = ()=>{ LS.set('accent',null); $('#accent').value='#2f6fed'; };
$('#clearHist').onclick = async ()=>{
  if (window.unto && window.unto.history) { await window.unto.history.clear(); flash(); }
  else { localStorage.setItem('unto.histCleared','1'); flash(); }
};
$('#clearData').onclick = async ()=>{
  if (window.unto && window.unto.privacy) { await window.unto.privacy.clearBrowsing(); flash(); }
  else flash();
};
$('#save').onclick = ()=>{
  LS.set('engine', $('#engine').value);
  LS.set('suggestions', $('#sug').checked);
  LS.set('anim', $('#anim').checked?'1':'0');
  LS.set('h24', $('#h24').checked);
  LS.set('accent', $('#accent').value || null);
  LS.set('ai', { url:$('#aiUrl').value.trim(), key:$('#aiKey').value.trim(), model:$('#aiModel').value.trim() });
  flash();
};
function flash(){ const m=$('#savedMsg'); m.classList.add('show'); setTimeout(()=>m.classList.remove('show'),1500); }
</script>
</body>
</html>
